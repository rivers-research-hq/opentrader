[package]
name = "ot-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Opentrader V2 terminal — egui/eframe chart alpha over the headless view-model."

[dependencies]
ot-core = { path = "../ot-core" }
ot-script = { path = "../ot-script" }
ot-venues = { path = "../ot-venues" }
serde = { workspace = true }
serde_json = { workspace = true }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui_plot = "0.33"

[[bin]]
name = "ot-terminal"
path = "src/main.rs"
