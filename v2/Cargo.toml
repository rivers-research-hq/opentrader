[workspace]
resolver = "2"
members = ["crates/ot-core", "crates/ot-venues", "crates/ot-v1-parity", "crates/ot-mcp", "crates/ot-script", "crates/ot-terminal", "crates/ot-updater"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
